<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="860" height="360" fill="#0f1115"/>
  <text x="30" y="42" fill="#e8eaf0" font-size="20" font-weight="700">Research Radar — Architecture</text>
  <text x="30" y="64" fill="#a2a9b8" font-size="13">How a click in the browser becomes ranked papers on your screen</text>

  <!-- Browser / Frontend -->
  <rect x="30" y="110" width="200" height="150" rx="14" fill="#171a21" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="130" y="138" fill="#7c9cff" font-size="13" font-weight="700" text-anchor="middle">FRONTEND</text>
  <text x="130" y="160" fill="#e8eaf0" font-size="14" text-anchor="middle" font-weight="600">React + Vite</text>
  <text x="130" y="184" fill="#a2a9b8" font-size="11.5" text-anchor="middle">The UI in your browser</text>
  <text x="130" y="202" fill="#a2a9b8" font-size="11.5" text-anchor="middle">buttons, paper cards,</text>
  <text x="130" y="219" fill="#a2a9b8" font-size="11.5" text-anchor="middle">topic editor</text>
  <text x="130" y="246" fill="#59d1a6" font-size="11" text-anchor="middle">hosted on Vercel</text>

  <!-- Backend -->
  <rect x="330" y="110" width="200" height="150" rx="14" fill="#171a21" stroke="#59d1a6" stroke-width="1.5"/>
  <text x="430" y="138" fill="#59d1a6" font-size="13" font-weight="700" text-anchor="middle">BACKEND API</text>
  <text x="430" y="160" fill="#e8eaf0" font-size="14" text-anchor="middle" font-weight="600">FastAPI (Python)</text>
  <text x="430" y="184" fill="#a2a9b8" font-size="11.5" text-anchor="middle">/api/papers</text>
  <text x="430" y="201" fill="#a2a9b8" font-size="11.5" text-anchor="middle">/api/topics</text>
  <text x="430" y="218" fill="#a2a9b8" font-size="11.5" text-anchor="middle">fetch + score + rank</text>
  <text x="430" y="246" fill="#59d1a6" font-size="11" text-anchor="middle">hosted on Render</text>

  <!-- Sources -->
  <rect x="630" y="110" width="200" height="150" rx="14" fill="#171a21" stroke="#c0392b" stroke-width="1.5"/>
  <text x="730" y="138" fill="#e57373" font-size="13" font-weight="700" text-anchor="middle">PAPER SOURCES</text>
  <text x="730" y="164" fill="#e8eaf0" font-size="13" text-anchor="middle">bioRxiv API</text>
  <text x="730" y="188" fill="#e8eaf0" font-size="13" text-anchor="middle">arXiv API</text>
  <text x="730" y="212" fill="#e8eaf0" font-size="13" text-anchor="middle">PubMed API</text>
  <text x="730" y="240" fill="#a2a9b8" font-size="11" text-anchor="middle">public, no API key</text>

  <!-- Arrows -->
  <line x1="230" y1="170" x2="325" y2="170" stroke="#7c9cff" stroke-width="2" marker-end="url(#a)"/>
  <text x="278" y="160" fill="#7c9cff" font-size="10.5" text-anchor="middle">HTTP</text>
  <text x="278" y="188" fill="#a2a9b8" font-size="10" text-anchor="middle">GET /api/papers</text>

  <line x1="325" y1="200" x2="235" y2="200" stroke="#59d1a6" stroke-width="2" marker-end="url(#a)"/>
  <text x="278" y="216" fill="#59d1a6" font-size="10" text-anchor="middle">JSON results</text>

  <line x1="530" y1="170" x2="625" y2="170" stroke="#e57373" stroke-width="2" marker-end="url(#a)"/>
  <text x="578" y="160" fill="#e57373" font-size="10.5" text-anchor="middle">fetch</text>
  <line x1="625" y1="200" x2="535" y2="200" stroke="#a2a9b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="578" y="216" fill="#a2a9b8" font-size="10" text-anchor="middle">recent papers</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8894ad"/>
    </marker>
  </defs>

  <text x="30" y="312" fill="#a2a9b8" font-size="12">1. You click Refresh in the React app  →  2. It calls the FastAPI backend  →</text>
  <text x="30" y="332" fill="#a2a9b8" font-size="12">3. The backend pulls fresh papers, scores them against your topics  →  4. Ranked JSON comes back and renders as cards.</text>
</svg>
